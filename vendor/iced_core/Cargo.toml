# iced_core from libcosmic 7e777077b81e3a1b9c7b723f35399e80f1b2cba5 (iced/core), with
# workspace inheritance resolved. Only change: the `hot` feature in src/widget/tree.rs.
# Refresh this copy whenever the libcosmic rev in crates/frontends/cosmic changes.
[package]
name = "iced_core"
description = "The essential ideas of iced"
version = "0.14.0"
edition = "2024"
license = "MIT"

# Upstream code: its warnings were capped while it came from git.
[lints.rust]
warnings = "allow"

[features]
advanced = []
crisp = []
basic-shaping = []
advanced-shaping = []
a11y = ["iced_accessibility"]
wayland = ["cctk"]
# Keeps named widget states in a plain static so hot-patched code shares them.
hot = []

[dependencies]
palette = "0.7"
bitflags = "2.5"
bytes = "1.6"
glam = "0.25"
lilt = "0.8"
log = "0.4"
num-traits = "0.2"
rustc-hash = "2.0"
smol_str = "0.3"
thiserror = "2"
unicode-segmentation = "1.0"
web-time = "1.1"
serde = { version = "1.0", optional = true, features = ["derive"] }
window_clipboard = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
dnd = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
mime = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
iced_accessibility = { git = "https://github.com/pop-os/libcosmic", rev = "7e777077b81e3a1b9c7b723f35399e80f1b2cba5", optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies]
cctk = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7", package = "cosmic-client-toolkit", optional = true }

[build-dependencies]
build_helpers = { git = "https://github.com/pop-os/libcosmic", rev = "7e777077b81e3a1b9c7b723f35399e80f1b2cba5" }
