[package]
name = "claudo-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
claudo-protocol.workspace = true
# The WebSocket client: the page's only transport, and a native window's for the daemon's room.
ewebsock = { version = "0.8", default-features = false }
serde_json.workspace = true

# The in-process transport bundles the backend (core). Gated to non-wasm so the
# web client build never pulls core (which spawns processes and touches the fs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
claudo-core.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
