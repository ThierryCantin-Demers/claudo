[package]
name = "claudo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "claudo-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
claudo-core.workspace = true
claudo-protocol.workspace = true
futures-util = "0.3.33"
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.0", features = ["fs"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
