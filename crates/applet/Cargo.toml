[package]
name = "claudo-applet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "claudo-applet"
path = "src/main.rs"

# Opt-in like claudo-cosmic, so a plain `cargo build --workspace` never compiles libcosmic.
[features]
default = []
cosmic = ["dep:libcosmic"]

[dependencies]
claudo-core.workspace = true
claudo-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "896b252dfc3c6cb0c678b844432016415dc104b1", optional = true, default-features = false, features = ["applet"] }
