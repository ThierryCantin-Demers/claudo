[package]
name = "claudo-applet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "claudo-applet"
path = "src/main.rs"

# Opt-in like claudo-cosmic, so a plain `cargo build --workspace` never compiles libcosmic.
[features]
default = []
cosmic = ["dep:libcosmic"]

[dependencies]
claudo-core.workspace = true
claudo-protocol.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "7e777077b81e3a1b9c7b723f35399e80f1b2cba5", optional = true, default-features = false, features = ["applet"] }
