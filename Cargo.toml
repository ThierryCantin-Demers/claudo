[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/transport",
    "crates/daemon",
    "crates/frontends/egui",
    "crates/frontends/cosmic",
    "crates/applet",
    "xtask",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Optimize dependencies even in dev builds. iced/cosmic-text text shaping is
# unusably slow unoptimized, which made debug runs of the cosmic frontend feel
# laggy. Own crates stay at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 3

# The web page, which every browser downloads: smaller rather than faster to build.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"

[workspace.dependencies]
claudo-protocol = { path = "crates/protocol" }
claudo-core = { path = "crates/core" }
claudo-transport = { path = "crates/transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dibstop-view = { git = "https://github.com/ThierryCantin-Demers/dibs", branch = "master" }

# libcosmic's iced_core, made patch-safe behind its `hot` feature; see vendor/iced_core/Cargo.toml.
[patch."https://github.com/pop-os/libcosmic"]
iced_core = { path = "vendor/iced_core" }
